[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-code-eval-sandbox"
version = "0.1.0"
description = "Containerized Execution Sandbox for AI Agent Code Benchmark Evals"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Wisdom Ogechi Owabor", email = "contact@wisdomowabor.online" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
